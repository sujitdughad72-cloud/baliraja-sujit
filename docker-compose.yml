version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. MySQL 8 Database
  # -------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: baliraja-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: sujit
      MYSQL_DATABASE: baliraja_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psujit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Python FastAPI AI/ML Microservice
  # -------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: baliraja-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  # -------------------------------------------------------------
  # 3. Java Spring Boot Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: baliraja-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql-db:3306/baliraja_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      - DB_USERNAME=root
      - DB_PASSWORD=sujit
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      mysql-db:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  mysql_data:
