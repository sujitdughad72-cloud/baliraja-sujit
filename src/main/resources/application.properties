# ===================================================================
# BALIRAJA BACKEND - APPLICATION CONFIGURATION
# ===================================================================

spring.application.name=baliraja-backend
server.port=8080

# -------------------------------------------------------------------
# 1. MySQL Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/baliraja_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sujit}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# 2. JPA & Hibernate ORM Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# 3. JWT Security Configuration
# -------------------------------------------------------------------
# 256-bit secure HMAC key for signing JWT tokens
baliraja.jwt.secret=BaliRajaSmartAgriPlatformSecretKey2026Secure256BitTokenKey!
# Expiration: 24 hours in milliseconds (86400000 ms)
baliraja.jwt.expiration=86400000

# -------------------------------------------------------------------
# 4. Python FastAPI AI/ML Microservice Integration
# -------------------------------------------------------------------
ai.service.base-url=http://localhost:8000
ai.service.timeout.connect-ms=3000
ai.service.timeout.read-ms=5000

# -------------------------------------------------------------------
# 5. SpringDoc OpenAPI / Swagger UI Configuration
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------------
# 6. File Upload Limits (For crop disease photos & product images)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
